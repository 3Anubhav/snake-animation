name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout repository (THIS FIXES THE /usr/bin/git ERROR)
      - name: Checkout repository
        uses: actions/checkout@v3

      # Generate snake animation
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: 3Anubhav
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=8A2BE2&color_dots=1A0B2E,3A0CA3,7209B7,8A2BE2,A855F7

      # Push to output branch
      - name: Push snake animation
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
